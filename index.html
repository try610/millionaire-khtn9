<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Triệu Phú KHTN 9 - Dữ Liệu Động</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle, #020111, #090a2a, #101540);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .game-container {
            width: 95vw;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            background: rgba(0, 5, 20, 0.95);
            border: 2px solid #00f2ff;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3);
        }
        .question-box {
            background: linear-gradient(135deg, #0a1128, #1c2541);
            border: 2px solid #3a506b;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.25rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn {
            background: #0b132b;
            border: 1px solid #3a506b;
            padding: 12px 20px;
            border-radius: 10px;
            transition: all 0.2s;
            text-align: left;
            cursor: pointer;
        }
        .option-btn:hover:not(:disabled) {
            border-color: #f1c40f;
            color: #f1c40f;
            background: #1c2541;
        }
        .option-btn.correct { background: #27ae60 !important; color: white; border-color: #2ecc71; }
        .option-btn.wrong { background: #c0392b !important; color: white; border-color: #e74c3c; }
        .score-item {
            padding: 4px 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8892b0;
        }
        .score-item.active {
            background: #f1c40f;
            color: #000;
            font-weight: bold;
        }
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #020111;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-cyan-500 mb-4"></div>
    <p class="text-xl font-bold text-cyan-400">Đang nạp ngân hàng câu hỏi...</p>
    <p id="error-msg" class="text-red-500 mt-2 hidden">Lỗi tải dữ liệu! Kiểm tra link questions.js</p>
</div>

<div class="game-container">
    <!-- Màn hình bắt đầu -->
    <div id="start-screen" class="absolute inset-0 z-50 bg-[#020111] flex flex-col justify-center items-center p-8 rounded-2xl">
        <h1 class="text-6xl font-black text-yellow-400 mb-2 italic">TRIỆU PHÚ KHTN 9</h1>
        <p class="text-cyan-400 tracking-[0.3em] mb-12 font-bold uppercase">500 Câu Hỏi Chinh Phục Kỳ Thi</p>
        <div class="w-80 space-y-4">
            <input type="text" id="player-name" placeholder="Nhập tên của mày..." class="w-full p-4 bg-gray-900 border-2 border-gray-700 rounded-xl outline-none focus:border-yellow-500 text-center">
            <button onclick="initGame()" class="w-full py-4 bg-yellow-600 hover:bg-yellow-500 rounded-xl font-black text-xl transition-all shadow-lg">VÀO THI</button>
        </div>
    </div>

    <!-- Giao diện chính -->
    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
            <div class="bg-yellow-500 text-black font-bold px-4 py-1 rounded-full text-sm shadow-md">LVL <span id="lvl-display">1</span></div>
            <div class="text-lg font-bold" id="name-display">Học sinh</div>
        </div>
        <div class="flex gap-3">
            <button id="help-50" onclick="useHelp('5050')" class="w-12 h-12 border-2 border-cyan-500 rounded-full flex items-center justify-center font-bold text-xs hover:bg-cyan-500/20">50:50</button>
            <button id="help-call" onclick="useHelp('expert')" class="w-12 h-12 border-2 border-cyan-500 rounded-full flex items-center justify-center font-bold text-xs hover:bg-cyan-500/20">GỌI</button>
        </div>
    </div>

    <div class="flex flex-1 gap-6 overflow-hidden">
        <div class="flex-1 flex flex-col justify-center">
            <div id="q-text" class="question-box mb-8 shadow-inner">Đang lấy câu hỏi...</div>
            <div class="grid grid-cols-2 gap-4" id="options-container">
                <button class="option-btn" id="opt-0"></button>
                <button class="option-btn" id="opt-1"></button>
                <button class="option-btn" id="opt-2"></button>
                <button class="option-btn" id="opt-3"></button>
            </div>
        </div>

        <div class="w-48 bg-black/30 border border-gray-800 rounded-xl p-4 flex flex-col-reverse gap-1 shadow-xl">
            <!-- Thang điểm -->
            <div class="score-item" data-idx="14"><span>15</span><span>10.0đ</span></div>
            <div class="score-item" data-idx="13"><span>14</span><span>9.3đ</span></div>
            <div class="score-item" data-idx="12"><span>13</span><span>8.7đ</span></div>
            <div class="score-item" data-idx="11"><span>12</span><span>8.0đ</span></div>
            <div class="score-item" data-idx="10"><span>11</span><span>7.3đ</span></div>
            <div class="score-item" data-idx="9"><span>10</span><span>6.7đ</span></div>
            <div class="score-item" data-idx="8"><span>09</span><span>6.0đ</span></div>
            <div class="score-item" data-idx="7"><span>08</span><span>5.3đ</span></div>
            <div class="score-item" data-idx="6"><span>07</span><span>4.7đ</span></div>
            <div class="score-item" data-idx="5"><span>06</span><span>4.0đ</span></div>
            <div class="score-item" data-idx="4"><span>05</span><span>3.3đ</span></div>
            <div class="score-item" data-idx="3"><span>04</span><span>2.7đ</span></div>
            <div class="score-item" data-idx="2"><span>03</span><span>2.0đ</span></div>
            <div class="score-item" data-idx="1"><span>02</span><span>1.3đ</span></div>
            <div class="score-item" data-idx="0"><span>01</span><span>0.7đ</span></div>
        </div>
    </div>
</div>

<!-- Scripts nạp dữ liệu -->
<script src="questions.js"></script>

<script>
    let rawBank = null;
    let currentQuestions = [];
    let currentStep = 0;
    let helpsUsed = { '5050': false, 'expert': false };

    // 1. Kiểm tra nạp dữ liệu
    window.addEventListener('load', () => {
        setTimeout(() => {
            if (typeof questionBank !== 'undefined') {
                rawBank = questionBank;
                document.getElementById('loading').style.display = 'none';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }, 1000);
    });

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        const name = document.getElementById('player-name').value || "Học sinh ẩn danh";
        document.getElementById('name-display').innerText = name;
        
        // Trộn và lấy bộ câu hỏi: 5 Dễ (know), 5 Trung bình (understand), 5 Khó (apply)
        currentQuestions = [
            ...shuffle([...rawBank.know]).slice(0, 5),
            ...shuffle([...rawBank.understand]).slice(0, 5),
            ...shuffle([...rawBank.apply]).slice(0, 5)
        ];

        currentStep = 0;
        document.getElementById('start-screen').classList.add('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const q = currentQuestions[currentStep];
        document.getElementById('q-text').innerText = `Câu ${currentStep + 1}: ${q.q}`;
        document.getElementById('lvl-display').innerText = currentStep + 1;

        // Cập nhật thang điểm
        document.querySelectorAll('.score-item').forEach(el => {
            el.classList.remove('active');
            if (parseInt(el.dataset.idx) === currentStep) el.classList.add('active');
        });

        // Tạo đáp án xáo trộn
        let options = q.a.map((text, i) => ({ text, isCorrect: i === q.c }));
        options = shuffle(options);

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn font-medium';
            btn.innerHTML = `<span class="text-yellow-500 font-bold mr-2">${String.fromCharCode(65+idx)}.</span> ${opt.text}`;
            btn.onclick = () => handleAnswer(opt.isCorrect, btn);
            container.appendChild(btn);
        });
    }

    function handleAnswer(isCorrect, btn) {
        // Khóa tất cả nút
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (isCorrect) {
            btn.classList.add('correct');
            setTimeout(() => {
                if (currentStep < 14) {
                    currentStep++;
                    renderQuestion();
                } else {
                    alert("CHÚC MỪNG! Mày đã đạt 10 điểm tuyệt đối!");
                    location.reload();
                }
            }, 1000);
        } else {
            btn.classList.add('wrong');
            // Hiện đáp án đúng
            alert("Sai rồi mày ơi! Thử lại nhé.");
            location.reload();
        }
    }

    function useHelp(type) {
        if (helpsUsed[type]) return;
        helpsUsed[type] = true;
        document.getElementById(type === '5050' ? 'help-50' : 'help-call').style.opacity = '0.3';

        if (type === '5050') {
            const btns = Array.from(document.querySelectorAll('.option-btn'));
            const q = currentQuestions[currentStep];
            const correctText = q.a[q.c];
            let hiddenCount = 0;
            btns.forEach(btn => {
                if (!btn.innerText.includes(correctText) && hiddenCount < 2) {
                    btn.style.visibility = 'hidden';
                    hiddenCount++;
                }
            });
        } else {
            const q = currentQuestions[currentStep];
            alert(`Chuyên gia Gen-Z tư vấn: "Tao thề là đáp án đúng là cái câu có chữ '${q.a[q.c].substring(0, 10)}...' đấy!"`);
        }
    }
</script>
</body>
</html>
