<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú - Vật Lý 9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #020617;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Logic hiển thị đáp án */
        .ans-btn {
            background: linear-gradient(to right, #1e293b, #334155);
            border: 2px solid #3b82f6;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            padding: 1.25rem 2rem;
            border-radius: 9999px;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .ans-btn:hover:not(.locked) {
            background: #f59e0b;
            color: black;
            border-color: white;
        }

        .ans-btn.selected { background: #ea580c !important; color: white; }
        .ans-btn.correct { background: #16a34a !important; color: white; border-color: white; }
        .ans-btn.wrong { background: #dc2626 !important; color: white; border-color: white; }

        .ans-hidden {
            display: none !important;
            pointer-events: none !important;
        }

        .money-item { font-size: 0.85rem; padding: 2px; }
        .money-item.active { background: #f59e0b; color: black; font-weight: bold; border-radius: 4px; }
        .money-item.milestone { color: #fde047; }

        #msg-box {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: #1d4ed8; border: 3px solid white; border-radius: 20px;
            padding: 20px; z-index: 5000; display: none; text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); min-width: 300px;
        }
    </style>
</head>
<body class="bg-slate-950">

    <audio id="s-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="s-correct" src="https://www.soundjay.com/human/applause-01.mp3"></audio>
    <audio id="s-wrong" src="https://assets.mixkit.co/active_storage/sfx/2959/2959-preview.mp3"></audio>

    <div id="msg-box" onclick="this.style.display='none'">
        <p id="msg-content" class="text-xl font-bold"></p>
        <p class="text-sm mt-2 opacity-70">Bấm để đóng</p>
    </div>

    <!-- Màn hình chào - Đã thêm ô SBD -->
    <div id="intro" class="fixed inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-5xl font-black text-yellow-500 mb-2">VẬT LÝ 9</h1>
        <p class="text-blue-400 mb-10 tracking-widest uppercase">Ai là triệu phú - Bản chuẩn GDPT</p>
        <div class="w-full max-w-md space-y-4">
            <input type="text" id="name-in" placeholder="Họ và tên thí sinh" class="w-full p-4 rounded-xl bg-slate-800 text-white border border-slate-700 outline-none focus:border-blue-500">
            <input type="text" id="sbd-in" placeholder="Số báo danh (SBD)" class="w-full p-4 rounded-xl bg-slate-800 text-white border border-slate-700 outline-none focus:border-blue-500">
            <button onclick="initGame()" class="w-full p-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-xl transition-all active:scale-95 shadow-lg">VÀO PHÒNG THI</button>
        </div>
    </div>

    <!-- Game Chính -->
    <div class="h-screen flex flex-col p-4 max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-slate-900/80 p-4 rounded-2xl border-b-2 border-blue-500 shadow-lg">
            <div class="text-lg">
                <span id="p-name" class="text-yellow-400 font-bold">Thí sinh</span> 
                <span class="mx-2 text-slate-500">|</span> 
                <span id="p-sbd" class="text-blue-400 italic">SBD: ---</span>
            </div>
            <div class="flex gap-4">
                <button id="help-50" onclick="use5050()" class="w-14 h-14 rounded-full bg-blue-700 border-2 border-white font-bold hover:bg-blue-600 disabled:opacity-30 disabled:grayscale transition-all shadow-md">50:50</button>
                <button id="help-call" onclick="useCall()" class="w-14 h-14 rounded-full bg-blue-700 border-2 border-white font-bold hover:bg-blue-600 disabled:opacity-30 disabled:grayscale transition-all shadow-md">📞</button>
                <button id="help-aud" onclick="useAud()" class="w-14 h-14 rounded-full bg-blue-700 border-2 border-white font-bold hover:bg-blue-600 disabled:opacity-30 disabled:grayscale transition-all shadow-md">👥</button>
            </div>
        </div>

        <div class="flex flex-1 gap-6 overflow-hidden">
            <div class="flex-[3] flex flex-col justify-end pb-10">
                <div id="q-area" class="bg-gradient-to-br from-blue-900 to-blue-700 p-8 rounded-[40px] border-4 border-slate-200 text-center text-2xl font-bold mb-8 shadow-2xl">
                    Đang chuẩn bị câu hỏi...
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="ans-container">
                    <button id="ans-0" onclick="checkAns(0)" class="ans-btn"><span class="text-yellow-400 font-bold mr-3">A:</span> <span class="txt">...</span></button>
                    <button id="ans-1" onclick="checkAns(1)" class="ans-btn"><span class="text-yellow-400 font-bold mr-3">B:</span> <span class="txt">...</span></button>
                    <button id="ans-2" onclick="checkAns(2)" class="ans-btn"><span class="text-yellow-400 font-bold mr-3">C:</span> <span class="txt">...</span></button>
                    <button id="ans-3" onclick="checkAns(3)" class="ans-btn"><span class="text-yellow-400 font-bold mr-3">D:</span> <span class="txt">...</span></button>
                </div>
            </div>

            <div id="score-board" class="flex-1 bg-slate-900/90 rounded-2xl p-4 flex flex-col-reverse border border-slate-800 shadow-inner">
                <!-- Score rendered by JS -->
            </div>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { q: "Chiết suất của một môi trường có giá trị bằng:", a: ["Tỉ số v ánh sáng chân không / v trong môi trường", "Tích v ánh sáng chân không và môi trường", "Hiệu v ánh sáng chân không và môi trường", "Tỉ số v ánh sáng môi trường / chân không"], c: 0, lv: 1 },
            { q: "Tia khúc xạ nằm ở đâu so với mặt phẳng tới?", a: ["Nằm trong mặt phẳng tới", "Nằm ngoài mặt phẳng tới", "Luôn vuông góc", "Luôn song song"], c: 0, lv: 1 },
            { q: "Ánh sáng trắng qua lăng kính bị phân tích thành dải màu gọi là gì?", a: ["Sự tán sắc ánh sáng", "Sự phản xạ ánh sáng", "Sự hội tụ ánh sáng", "Sự khúc xạ đơn thuần"], c: 0, lv: 1 },
            { q: "Vật màu xanh lá cây khi nhìn dưới ánh sáng trắng sẽ có màu gì?", a: ["Màu xanh lá cây", "Màu đỏ", "Màu đen", "Màu trắng"], c: 0, lv: 1 },
            { q: "Tầng Ozone bảo vệ chúng ta khỏi loại tia nào?", a: ["Tia tử ngoại (UV)", "Tia hồng ngoại", "Tia X", "Tia Gamma"], c: 0, lv: 1 },
            { q: "Đơn vị của công suất là gì?", a: ["Oát (W)", "Jun (J)", "Niuton (N)", "Mét (m)"], c: 0, lv: 1 },
            { q: "Khi ánh sáng truyền từ nước ra không khí, góc khúc xạ r so với góc tới i như thế nào?", a: ["r > i", "r < i", "r = i", "Không xác định"], c: 0, lv: 2 },
            { q: "Hiện tượng phản xạ toàn phần xảy ra khi nào?", a: ["i ≥ i tới hạn", "i < i tới hạn", "i luôn bằng 0", "i bằng 90 độ"], c: 0, lv: 2 },
            { q: "Công thức tính công suất P là:", a: ["P = A / t", "P = A * t", "P = F * s", "P = m * g"], c: 0, lv: 2 },
            { q: "Tại sao ta thấy bầu trời có màu xanh?", a: ["Do sự tán xạ ánh sáng trong khí quyển", "Do nước biển phản chiếu lên", "Do tầng ozone có màu xanh", "Do mắt người tự nhìn ra màu xanh"], c: 0, lv: 2 },
            { q: "Máy kéo thực hiện công 60.000 J trong 20s. Công suất máy là:", a: ["3.000 W", "1.200.000 W", "1.200 W", "300 W"], c: 0, lv: 3 },
            { q: "Nước có n=1.33. Vận tốc ánh sáng trong nước xấp xỉ bao nhiêu?", a: ["225.560 km/s", "300.000 km/s", "150.000 km/s", "200.000 km/s"], c: 0, lv: 3 },
            { q: "Vật nâng cao 2m, trọng lượng 50N trong 5s. Công suất nâng là:", a: ["20 W", "500 W", "100 W", "250 W"], c: 0, lv: 3 },
            { q: "Một chùm sáng truyền từ thủy tinh (n=1.5) ra không khí. Góc tới hạn là:", a: ["~41.8 độ", "48.6 độ", "30 độ", "60 độ"], c: 0, lv: 3 },
            { q: "Động cơ công suất 2kW chạy trong 1 giờ thực hiện công là:", a: ["7.200.000 J", "2.000 J", "3.600 J", "120.000 J"], c: 0, lv: 3 }
        ];

        const SCORES = ["0.2","0.4","0.6","0.8","5.0","5.4","5.8","6.0","8.0","9.0","9.2","9.4","9.6","9.8","10.0"];
        let currentIdx = 0;
        let gamePool = [];
        let canClick = true;

        function play(id) {
            const s = document.getElementById('s-'+id);
            if(s) { s.currentTime = 0; s.play().catch(()=>{}); }
        }

        function showMsg(txt) {
            const b = document.getElementById('msg-box');
            document.getElementById('msg-content').innerText = txt;
            b.style.display = 'block';
            setTimeout(() => b.style.display = 'none', 4000);
        }

        function initGame() {
            const name = document.getElementById('name-in').value;
            const sbd = document.getElementById('sbd-in').value;
            if(!name || !sbd) return alert("Mày phải nhập đủ Tên và SBD mới được thi!");
            
            document.getElementById('p-name').innerText = name;
            document.getElementById('p-sbd').innerText = "SBD: " + sbd;
            document.getElementById('intro').style.display = 'none';
            
            const l1 = QUESTIONS.filter(q => q.lv === 1).sort(() => Math.random()-0.5).slice(0,5);
            const l2 = QUESTIONS.filter(q => q.lv === 2).sort(() => Math.random()-0.5).slice(0,5);
            const l3 = QUESTIONS.filter(q => q.lv === 3).sort(() => Math.random()-0.5).slice(0,5);
            gamePool = [...l1, ...l2, ...l3];

            renderScoreBoard();
            loadQuestion();
        }

        function renderScoreBoard() {
            const board = document.getElementById('score-board');
            board.innerHTML = '';
            SCORES.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = `money-item ${i === currentIdx ? 'active' : ''} ${[4,9,14].includes(i) ? 'milestone' : ''}`;
                div.innerText = `Câu ${i+1}: ${val}`;
                board.appendChild(div);
            });
        }

        function loadQuestion() {
            canClick = true;
            const data = gamePool[currentIdx];
            document.getElementById('q-area').innerText = `Câu ${currentIdx+1}: ${data.q}`;
            
            let rawAns = data.a.map((text, i) => ({ text, isCorrect: i === data.c }));
            rawAns = rawAns.sort(() => Math.random() - 0.5);

            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`ans-${i}`);
                btn.querySelector('.txt').innerText = rawAns[i].text;
                btn.dataset.correct = rawAns[i].isCorrect;
                btn.classList.remove('selected', 'correct', 'wrong', 'ans-hidden', 'locked');
            }
        }

        function checkAns(idx) {
            if(!canClick) return;
            canClick = false;
            
            const btn = document.getElementById(`ans-${idx}`);
            btn.classList.add('selected');
            play('click');

            setTimeout(() => {
                if(btn.dataset.correct === "true") {
                    btn.classList.add('correct');
                    play('correct');
                    setTimeout(() => {
                        if(currentIdx < 14) {
                            currentIdx++;
                            renderScoreBoard();
                            loadQuestion();
                        } else {
                            victory();
                        }
                    }, 1500);
                } else {
                    btn.classList.add('wrong');
                    play('wrong');
                    for(let i=0; i<4; i++) {
                        const b = document.getElementById(`ans-${i}`);
                        if(b.dataset.correct === "true") b.classList.add('correct');
                    }
                    setTimeout(gameOver, 2000);
                }
            }, 1000);
        }

        function use5050() {
            if(!canClick) return;
            const btn50 = document.getElementById('help-50');
            if(btn50.disabled) return;
            btn50.disabled = true;

            let incorrectOnes = [];
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-${i}`);
                if(b.dataset.correct === "false") incorrectOnes.push(b);
            }
            incorrectOnes.sort(() => Math.random() - 0.5);
            incorrectOnes[0].classList.add('ans-hidden');
            incorrectOnes[1].classList.add('ans-hidden');
            showMsg("Đã loại bỏ 2 phương án sai!");
        }

        function useCall() {
            if(!canClick) return;
            const btn = document.getElementById('help-call');
            if(btn.disabled) return;
            btn.disabled = true;

            let correctLabel = "A";
            for(let i=0; i<4; i++) {
                if(document.getElementById(`ans-${i}`).dataset.correct === "true") {
                    correctLabel = String.fromCharCode(65+i);
                }
            }
            showMsg(`Người thân bảo: "Tao chắc chắn là ${correctLabel}!"`);
        }

        function useAud() {
            if(!canClick) return;
            const btn = document.getElementById('help-aud');
            if(btn.disabled) return;
            btn.disabled = true;

            let correctLabel = "A";
            for(let i=0; i<4; i++) {
                if(document.getElementById(`ans-${i}`).dataset.correct === "true") {
                    correctLabel = String.fromCharCode(65+i);
                }
            }
            showMsg(`Khán giả: 80% chọn ${correctLabel}!`);
        }

        function gameOver() {
            let score = "0.0";
            if(currentIdx >= 10) score = "8.0";
            else if(currentIdx >= 5) score = "5.0";
            else score = currentIdx > 0 ? SCORES[currentIdx-1] : "0.0";

            alert(`DỪNG CUỘC CHƠI!\nThí sinh: ${document.getElementById('p-name').innerText}\n${document.getElementById('p-sbd').innerText}\nĐiểm số: ${score}`);
            location.reload();
        }

        function victory() {
            alert(`XUẤT SẮC!\nBạn đã trở thành Triệu phú Vật lý.\nĐiểm: 10.0`);
            location.reload();
        }
    </script>
</body>
</html>
