<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Triệu Phú - KHTN 9 (Hệ Điểm 10)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle, #020111, #090a2a, #101540);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }
        .game-container {
            width: 95vw;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            background: rgba(0, 5, 20, 0.95);
            border: 2px solid #00f2ff;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a2a4a;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }
        .quiz-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .score-board {
            width: 220px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column-reverse;
            font-size: 14px;
            border: 1px solid #1a2a4a;
        }
        .score-item {
            padding: 4px 12px;
            margin: 1px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            color: #e0e0e0;
        }
        .score-item.active { 
            background: linear-gradient(to right, #f1c40f, #f39c12); 
            color: #000; 
            font-weight: bold;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
        }
        .score-item.milestone { 
            color: #fff; 
            font-weight: bold;
            text-shadow: 0 0 5px #00f2ff;
        }
        .score-item.milestone span:last-child {
            color: #00f2ff;
        }

        .question-box {
            background: linear-gradient(135deg, #0a1128, #1c2541);
            border: 2px solid #3a506b;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 20px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-btn {
            background: #0b132b;
            border: 1px solid #3a506b;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .option-btn:hover:not(:disabled) { 
            background: #1c2541; 
            border-color: #f1c40f;
            color: #f1c40f;
        }
        .option-btn.correct { background: #27ae60 !important; color: white; border-color: #fff; }
        .option-btn.wrong { background: #c0392b !important; color: white; border-color: #fff; }
        .option-btn.hidden { visibility: hidden; }

        #login-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #090a2a, #020111);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(8px);
        }
        .modal {
            background: #0b132b;
            padding: 40px;
            border-radius: 24px;
            border: 3px solid #f1c40f;
            text-align: center;
            width: 480px;
            box-shadow: 0 0 50px rgba(241, 196, 15, 0.3);
        }
        .btn-help {
            transition: all 0.3s;
            background: rgba(0, 242, 255, 0.05);
            cursor: pointer;
        }
        .btn-help:hover:not(:disabled) {
            background: #00f2ff;
            color: #000;
        }
        .btn-help:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
        
        /* Bar chart for audience help */
        .audience-bar-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 150px;
            margin: 20px 0;
            padding-top: 20px;
        }
        .audience-bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40px;
        }
        .audience-bar {
            width: 30px;
            background: linear-gradient(to top, #00f2ff, #0077ff);
            border-radius: 5px 5px 0 0;
            transition: height 1s ease-out;
            min-height: 5px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="text-center">
            <h1 class="text-6xl font-extrabold mb-2 text-yellow-400 italic tracking-tighter">KIỂM TRA KHTN 9</h1>
            <p class="text-cyan-400 mb-8 tracking-widest uppercase text-sm font-bold">Chinh phục thang điểm 10</p>
            <div class="space-y-4">
                <input type="text" id="user-name" placeholder="Họ và tên học sinh" class="block w-80 p-4 bg-gray-900 rounded-xl border-2 border-gray-700 outline-none focus:border-yellow-500 mx-auto text-center text-lg">
                <input type="text" id="user-sbd" placeholder="Số báo danh (SBD)" class="block w-80 p-4 bg-gray-900 rounded-xl border-2 border-gray-700 outline-none focus:border-yellow-500 mx-auto text-center text-lg font-mono">
            </div>
            <button onclick="startGame()" class="mt-10 bg-yellow-600 hover:bg-yellow-500 px-16 py-4 rounded-full font-black text-xl transition-all hover:scale-105">BẮT ĐẦU LÀM BÀI</button>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="flex items-center">
            <div class="bg-yellow-500 text-black font-black px-3 py-1 rounded mr-3 text-sm">SBD: <span id="display-sbd">---</span></div>
            <div class="text-xl font-bold text-white uppercase" id="display-name">---</div>
        </div>
        <div class="flex gap-4">
            <button class="btn-help w-14 h-14 border-2 border-cyan-400 rounded-full text-[11px] font-bold" id="help-5050" onclick="handleHelp('5050')">50/50</button>
            <button class="btn-help w-14 h-14 border-2 border-cyan-400 rounded-full text-[11px] font-bold" id="help-audience" onclick="handleHelp('audience')">KHÁN GIẢ</button>
            <button class="btn-help w-14 h-14 border-2 border-cyan-400 rounded-full text-[11px] font-bold" id="help-call" onclick="handleHelp('expert')">CHUYÊN GIA</button>
        </div>
    </div>

    <!-- Main -->
    <div class="main-content">
        <div class="quiz-section">
            <div id="question-text" class="question-box">Vui lòng đăng nhập...</div>
            <div class="options-grid">
                <button class="option-btn" id="opt-0"></button>
                <button class="option-btn" id="opt-1"></button>
                <button class="option-btn" id="opt-2"></button>
                <button class="option-btn" id="opt-3"></button>
            </div>
        </div>
        <div class="score-board" id="score-list"></div>
    </div>
</div>

<!-- Hệ thống Modal dùng chung cho thông báo và trợ giúp -->
<div id="overlay" class="overlay">
    <div class="modal">
        <h2 id="modal-title" class="text-3xl font-black mb-2 text-yellow-400 uppercase">THÔNG BÁO</h2>
        <div id="modal-score-display" class="hidden text-6xl font-bold text-white my-6">0.0</div>
        <div id="modal-body" class="text-lg mb-6 text-gray-300"></div>
        <div id="audience-chart" class="hidden">
            <div class="audience-bar-container">
                <div class="audience-bar-item">
                    <span id="percent-A" class="text-xs mb-1 font-bold">0%</span>
                    <div id="bar-A" class="audience-bar" style="height: 0%"></div>
                    <span class="mt-1 font-bold">A</span>
                </div>
                <div class="audience-bar-item">
                    <span id="percent-B" class="text-xs mb-1 font-bold">0%</span>
                    <div id="bar-B" class="audience-bar" style="height: 0%"></div>
                    <span class="mt-1 font-bold">B</span>
                </div>
                <div class="audience-bar-item">
                    <span id="percent-C" class="text-xs mb-1 font-bold">0%</span>
                    <div id="bar-C" class="audience-bar" style="height: 0%"></div>
                    <span class="mt-1 font-bold">C</span>
                </div>
                <div class="audience-bar-item">
                    <span id="percent-D" class="text-xs mb-1 font-bold">0%</span>
                    <div id="bar-D" class="audience-bar" style="height: 0%"></div>
                    <span class="mt-1 font-bold">D</span>
                </div>
            </div>
        </div>
        <button id="modal-btn" onclick="closeModal()" class="bg-yellow-600 hover:bg-yellow-500 px-12 py-3 rounded-full font-bold text-white transition-all">ĐÃ HIỂU</button>
    </div>
</div>

<script>
    const mastersBank = {
        know: [
            { q: "Chiết suất n của một môi trường trong suốt được tính theo công thức nào?", a: ["n = c/v", "n = v/c", "n = c.v", "n = c - v"], c: 0 },
            { q: "Tia khúc xạ nằm trong mặt phẳng nào sau đây?", a: ["Mặt phẳng tới", "Mặt phẳng gương", "Mặt phẳng nằm ngang", "Mặt phẳng chứa tia phản xạ"], c: 0 },
            { q: "Hiện tượng ánh sáng bị lệch phương truyền khi đi qua mặt phân cách gọi là:", a: ["Khúc xạ ánh sáng", "Tán sắc ánh sáng", "Phản xạ ánh sáng", "Hấp thụ ánh sáng"], c: 0 },
            { q: "Ánh sáng màu là ánh sáng:", a: ["Có một màu nhất định", "Có màu trắng", "Có thể tán sắc được", "Không bị hấp thụ"], c: 0 },
            { q: "Đơn vị đo công suất (P) trong hệ SI là:", a: ["Watt (W)", "Joule (J)", "Newton (N)", "Volt (V)"], c: 0 },
            { q: "Chiết suất của chân không có giá trị bằng:", a: ["1", "0", "1.33", "1.5"], c: 0 },
            { q: "Công thức tính công suất là:", a: ["P = A/t", "P = A.t", "P = F.s", "P = m.g"], c: 0 }
        ],
        understand: [
            { q: "Tại sao tầng ozone lại quan trọng đối với sự sống?", a: ["Hấp thụ tia tử ngoại độc hại", "Giúp ánh sáng tán sắc tốt hơn", "Làm giảm khúc xạ ánh sáng", "Tăng năng lượng cho cây"], c: 0 },
            { q: "Tán sắc ánh sáng trắng qua lăng kính là do:", a: ["Chiết suất lăng kính khác nhau với các màu", "Lăng kính có các mặt nghiêng", "Ánh sáng bị phản xạ bên trong", "Lăng kính tự tạo màu"], c: 0 },
            { q: "Tại sao vật có màu lục dưới ánh sáng Mặt Trời?", a: ["Phản xạ màu lục, hấp thụ các màu khác", "Tự phát ra màu lục", "Hấp thụ màu đỏ hoàn toàn", "Làm tán sắc ánh sáng trắng"], c: 0 },
            { q: "Khi cắm ống hút vào cốc nước, ta thấy ống hút bị gãy là do:", a: ["Khúc xạ ánh sáng", "Phản xạ toàn phần", "Tán sắc", "Mắt nhìn sai"], c: 0 },
            { q: "Ánh sáng Mặt Trời cung cấp năng lượng qua quá trình:", a: ["Quang hợp", "Hô hấp", "Tán sắc", "Khúc xạ"], c: 0 }
        ],
        apply: [
            { q: "Động cơ thực hiện công 30000J trong 1 phút. Công suất là:", a: ["500 W", "30000 W", "1.8 MW", "50 W"], c: 0 },
            { q: "Chiếu từ nước (n=1.33) sang không khí. Góc tới hạn i_th xấp xỉ:", a: ["48.8 độ", "42 độ", "90 độ", "30 độ"], c: 0 },
            { q: "Một máy kéo 10 kW. Trong 2 giờ máy thực hiện công:", a: ["72 MJ", "20 kJ", "5 kJ", "720 J"], c: 0 },
            { q: "Để có phản xạ toàn phần, góc tới i phải thỏa mãn:", a: ["i ≥ i_th", "i < i_th", "i = 0", "i = r"], c: 0 },
            { q: "Vật màu đỏ đặt dưới ánh sáng xanh lục thì mắt thấy màu:", a: ["Đen", "Đỏ", "Xanh lục", "Vàng"], c: 0 }
        ]
    };

    let gameQuestions = [];
    let currentIdx = 0;
    let usedHelps = { '5050': false, 'audience': false, 'expert': false };
    const pointsList = ["0.7", "1.3", "2.0", "2.7", "3.3", "4.0", "4.7", "5.3", "6.0", "6.7", "7.3", "8.0", "8.7", "9.3", "10.0"];
    let currentOptionsMapping = []; // Lưu trữ xem opt-0 là đáp án nào trong câu hỏi gốc

    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

    function startGame() {
        const name = document.getElementById('user-name').value;
        const sbd = document.getElementById('user-sbd').value;
        if(!name || !sbd) return;
        
        document.getElementById('display-name').innerText = name;
        document.getElementById('display-sbd').innerText = sbd;
        document.getElementById('login-screen').style.display = 'none';
        
        gameQuestions = [
            ...shuffle([...mastersBank.know]).slice(0, 5),
            ...shuffle([...mastersBank.understand]).slice(0, 5),
            ...shuffle([...mastersBank.apply]).slice(0, 5)
        ];
        currentIdx = 0;
        loadQuestion();
    }

    function loadQuestion() {
        const q = gameQuestions[currentIdx];
        document.getElementById('question-text').innerText = `CÂU ${currentIdx + 1}: ${q.q}`;
        
        let opts = q.a.map((t, i) => ({ t, originalIdx: i, isCorrect: i === q.c }));
        opts = shuffle(opts);
        currentOptionsMapping = opts; // Để biết A, B, C, D đang ứng với cái nào
        
        opts.forEach((o, i) => {
            const btn = document.getElementById(`opt-${i}`);
            btn.innerText = `${String.fromCharCode(65+i)}. ${o.t}`;
            btn.className = 'option-btn';
            btn.disabled = false;
            btn.classList.remove('hidden');
            btn.onclick = () => checkAnswer(o.isCorrect, i, opts);
        });
        renderScoreBoard();
    }

    function checkAnswer(isCorrect, idx, opts) {
        document.querySelectorAll('.option-btn').forEach(b => b.onclick = null);
        const btn = document.getElementById(`opt-${idx}`);
        
        if(isCorrect) {
            btn.classList.add('correct');
            setTimeout(() => {
                if(currentIdx === 14) {
                    finishGame(10, "Xuất sắc! Mày thực sự là trùm KHTN 9!");
                } else {
                    currentIdx++;
                    loadQuestion();
                }
            }, 800);
        } else {
            btn.classList.add('wrong');
            opts.forEach((o, i) => { if(o.isCorrect) document.getElementById(`opt-${i}`).classList.add('correct'); });
            
            let score = currentIdx === 0 ? 0 : parseFloat(pointsList[currentIdx - 1]);
            setTimeout(() => {
                finishGame(score.toFixed(1), score >= 5 ? "Cũng được đấy, nhưng cố gắng hơn nhé!" : "Về học bài ngay đi, điểm này là dưới trung bình rồi!");
            }, 1000);
        }
    }

    function handleHelp(type) {
        if(usedHelps[type]) return;
        
        const q = gameQuestions[currentIdx];
        const correctAnsText = q.a[q.c];

        if(type === '5050') {
            usedHelps['5050'] = true;
            document.getElementById('help-5050').disabled = true;
            let removed = 0;
            const btnIndices = shuffle([0, 1, 2, 3]);
            btnIndices.forEach(i => {
                const btn = document.getElementById(`opt-${i}`);
                if(!btn.innerText.includes(correctAnsText) && removed < 2) {
                    btn.classList.add('hidden');
                    removed++;
                }
            });
        } else if(type === 'audience') {
            usedHelps['audience'] = true;
            document.getElementById('help-audience').disabled = true;
            
            // Tính toán tỉ lệ ảo
            let percentages = [0, 0, 0, 0];
            let correctPos = currentOptionsMapping.findIndex(o => o.isCorrect);
            
            let mainProb = Math.floor(Math.random() * 25) + 60; // 60% -> 85% cho câu đúng
            percentages[correctPos] = mainProb;
            
            let remaining = 100 - mainProb;
            let p1 = Math.floor(Math.random() * (remaining / 2));
            let p2 = Math.floor(Math.random() * (remaining - p1));
            let p3 = remaining - p1 - p2;
            
            let others = [p1, p2, p3];
            let otherIdx = 0;
            for(let i=0; i<4; i++) {
                if(i !== correctPos) {
                    percentages[i] = others[otherIdx++];
                }
            }

            showAudienceChart(percentages);
        } else if(type === 'expert') {
            usedHelps['expert'] = true;
            document.getElementById('help-call').disabled = true;
            showModal("Ý KIẾN CHUYÊN GIA", `Chuyên gia KHTN phân tích: "Dựa trên kiến thức lớp 9, tôi khẳng định đáp án đúng là ${correctAnsText}."`);
        }
    }

    function showAudienceChart(percents) {
        const letters = ['A', 'B', 'C', 'D'];
        letters.forEach((l, i) => {
            document.getElementById(`percent-${l}`).innerText = percents[i] + '%';
            document.getElementById(`bar-${l}`).style.height = percents[i] + '%';
        });
        
        document.getElementById('modal-title').innerText = "Ý KIẾN KHÁN GIẢ";
        document.getElementById('modal-body').innerText = "Đại đa số khán giả đang nghiêng về một đáp án nhất định:";
        document.getElementById('audience-chart').classList.remove('hidden');
        document.getElementById('modal-score-display').classList.add('hidden');
        document.getElementById('modal-btn').innerText = "ĐÃ HIỂU";
        document.getElementById('modal-btn').onclick = closeModal;
        document.getElementById('overlay').style.display = 'flex';
    }

    function renderScoreBoard() {
        const list = document.getElementById('score-list');
        list.innerHTML = '';
        pointsList.forEach((p, i) => {
            const div = document.createElement('div');
            const isMilestone = [4, 9, 14].includes(i);
            div.className = `score-item ${i === currentIdx ? 'active' : ''} ${isMilestone ? 'milestone' : ''}`;
            div.innerHTML = `<span>Câu ${i+1}</span><span>${p}đ</span>`;
            list.appendChild(div);
        });
    }

    function showModal(title, body) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerText = body;
        document.getElementById('audience-chart').classList.add('hidden');
        document.getElementById('modal-score-display').classList.add('hidden');
        document.getElementById('modal-btn').innerText = "ĐÃ HIỂU";
        document.getElementById('modal-btn').onclick = closeModal;
        document.getElementById('overlay').style.display = 'flex';
    }

    function finishGame(score, message) {
        document.getElementById('modal-title').innerText = "KẾT THÚC BÀI THI";
        document.getElementById('modal-body').innerText = message;
        document.getElementById('modal-score-display').innerText = score;
        document.getElementById('modal-score-display').classList.remove('hidden');
        document.getElementById('audience-chart').classList.add('hidden');
        document.getElementById('modal-btn').innerText = "LÀM LẠI";
        document.getElementById('modal-btn').onclick = () => location.reload();
        document.getElementById('overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('audience-chart').classList.add('hidden');
    }
</script>
</body>
</html>
