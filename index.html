<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai là triệu phú - KHTN 9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }
        .game-container {
            width: 95vw;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #ffd700;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }
        .quiz-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .score-board {
            width: 180px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column-reverse;
            font-size: 14px;
        }
        .score-item {
            padding: 2px 8px;
            margin: 1px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            color: #ccc;
        }
        .score-item.active { background: #ff9800; color: black; font-weight: bold; }
        .score-item.milestone { color: #fff; font-weight: bold; border-left: 3px solid #ffd700; }

        .question-box {
            background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
            border: 2px solid #aaa;
            padding: 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-btn {
            background: linear-gradient(to bottom, #141e30, #243b55);
            border: 2px solid #aaa;
            padding: 15px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            padding-left: 40px;
        }
        .option-btn:hover:not(:disabled) { background: #3a506b; border-color: #ffd700; }
        .option-btn.correct { background: #2ecc71 !important; border-color: #fff; color: white; }
        .option-btn.wrong { background: #e74c3c !important; border-color: #fff; }
        .option-btn.hidden { visibility: hidden; }

        .btn-help {
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid gold;
            background: #000; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-help:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Màn hình đăng nhập */
        #login-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 30, 0.95);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid gold;
            text-align: center;
            width: 400px;
        }
        .input-group input {
            width: 100%;
            background: #000;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
            color: white;
            margin-bottom: 15px;
            outline: none;
        }
        .input-group input:focus { border-color: gold; }
        .start-btn {
            background: gold; color: #000; font-weight: bold;
            padding: 12px 30px; border-radius: 20px; cursor: pointer;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal {
            background: #1a2a6c;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid gold;
            text-align: center;
            width: 400px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="login-screen">
        <div class="login-card">
            <h1 class="text-3xl font-bold mb-6 text-yellow-500 uppercase italic">Triệu Phú KHTN 9</h1>
            <div class="input-group">
                <input type="text" id="user-name" placeholder="Họ và tên của mày...">
                <input type="text" id="user-sbd" placeholder="Số báo danh (SBD)...">
            </div>
            <button onclick="startGame()" class="start-btn">VÀO THI NGAY</button>
        </div>
    </div>

    <div class="header">
        <div>
            <span id="display-name" class="text-yellow-400 font-bold mr-4"></span>
            <span id="display-sbd" class="text-blue-300"></span>
        </div>
        <div class="flex gap-2">
            <button class="btn-help" id="help-5050" onclick="help5050()">50:50</button>
            <button class="btn-help" id="help-call" onclick="helpCall()">📞</button>
        </div>
    </div>

    <div class="main-content">
        <div class="quiz-section">
            <div id="question-text" class="question-box">Đang tải câu hỏi...</div>
            <div class="options-grid">
                <button class="option-btn" id="opt-0"></button>
                <button class="option-btn" id="opt-1"></button>
                <button class="option-btn" id="opt-2"></button>
                <button class="option-btn" id="opt-3"></button>
            </div>
        </div>
        <div class="score-board" id="score-list"></div>
    </div>
</div>

<div id="overlay" class="overlay">
    <div class="modal">
        <h2 id="modal-title" class="text-2xl font-bold mb-4"></h2>
        <p id="modal-body" class="mb-6"></p>
        <button onclick="closeModal()" id="modal-btn" class="bg-yellow-500 text-black px-6 py-2 rounded-full font-bold">OK</button>
    </div>
</div>

<!-- Nạp dữ liệu từ file bên ngoài -->
<script src="questions.js"></script>

<script>
    let currentIdx = 0;
    let currentQuestions = [];
    let helps = { '5050': false, 'call': false };

    const prizeTable = [
        "0.7đ", "1.3đ", "2.0đ", "2.7đ", "3.3đ", 
        "4.0đ", "4.7đ", "5.3đ", "6.0đ", "6.7đ", 
        "7.3đ", "8.0đ", "8.7đ", "9.3đ", "10đ"
    ];

    function startGame() {
        const name = document.getElementById('user-name').value;
        const sbd = document.getElementById('user-sbd').value;
        if(!name || !sbd) return alert("Nhập đủ Tên và SBD đi mày!");

        document.getElementById('display-name').innerText = "TS: " + name;
        document.getElementById('display-sbd').innerText = "SBD: " + sbd;
        document.getElementById('login-screen').style.display = 'none';

        // Lấy bộ câu hỏi từ ngân hàng (5 Biết, 5 Hiểu, 5 Vận dụng)
        if (typeof questionBank !== 'undefined') {
            currentQuestions = [
                ...questionBank.know.sort(() => 0.5 - Math.random()).slice(0, 5),
                ...questionBank.understand.sort(() => 0.5 - Math.random()).slice(0, 5),
                ...questionBank.apply.sort(() => 0.5 - Math.random()).slice(0, 5)
            ];
            loadQuestion();
        } else {
            alert("Lỗi: Không tìm thấy file questions.js!");
        }
    }

    function loadQuestion() {
        const q = currentQuestions[currentIdx];
        document.getElementById('question-text').innerText = `Câu ${currentIdx + 1}: ${q.q}`;
        
        let opts = q.a.map((text, i) => ({ text, isCorrect: i === q.c }));
        opts.sort(() => 0.5 - Math.random());

        opts.forEach((opt, i) => {
            const btn = document.getElementById(`opt-${i}`);
            btn.innerText = `${String.fromCharCode(65+i)}: ${opt.text}`;
            btn.className = 'option-btn';
            btn.style.visibility = 'visible';
            btn.onclick = () => check(opt.isCorrect, i);
        });
        renderBoard();
    }

    function check(isCorrect, i) {
        const btn = document.getElementById(`opt-${i}`);
        if(isCorrect) {
            btn.classList.add('correct');
            setTimeout(() => {
                if(currentIdx < 14) { currentIdx++; loadQuestion(); }
                else { showModal("CHIẾN THẮNG", "Mày đã đạt 10 điểm tuyệt đối!", true); }
            }, 1000);
        } else {
            btn.classList.add('wrong');
            showModal("THẤT BẠI", "Sai rồi, về học bài đi!", true);
        }
    }

    function renderBoard() {
        const board = document.getElementById('score-list');
        board.innerHTML = '';
        prizeTable.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `score-item ${i === currentIdx ? 'active' : ''} ${[4,9,14].includes(i) ? 'milestone' : ''}`;
            div.innerHTML = `<span>${i+1}</span> <span>${p}</span>`;
            board.appendChild(div);
        });
    }

    function help5050() {
        if(helps['5050']) return;
        helps['5050'] = true;
        document.getElementById('help-5050').disabled = true;
        const q = currentQuestions[currentIdx];
        let count = 0;
        for(let i=0; i<4; i++) {
            const btn = document.getElementById(`opt-${i}`);
            if(!btn.innerText.includes(q.a[q.c]) && count < 2) {
                btn.style.visibility = 'hidden';
                count++;
            }
        }
    }

    function helpCall() {
        if(helps['call']) return;
        helps['call'] = true;
        document.getElementById('help-call').disabled = true;
        const q = currentQuestions[currentIdx];
        showModal("Gọi điện", `Chuyên gia nói: "Tao chắc chắn là câu có chữ '${q.a[q.c].substring(0,5)}...' đó!"`);
    }

    function showModal(title, body, reload = false) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerText = body;
        document.getElementById('overlay').style.display = 'flex';
        if(reload) document.getElementById('modal-btn').onclick = () => location.reload();
    }

    function closeModal() { document.getElementById('overlay').style.display = 'none'; }
</script>
</body>
</html>
